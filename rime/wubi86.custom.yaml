patch:

  # 允许分号作为编码，且不产生候选
  # 告诉 speller，; 是合法输入码
  "speller/alphabet": "zyxwvutsrqponmlkjihgfedcba;"

  "switches/@0/abbrev": [ 中, 英 ]

  # 开启自动造词功能 (如果你喜欢清歌的智能造词)
  "translator/enable_encoder": true

  # 将 'z' 键定义为拼音反查 (默认通常就是 z，这里显式声明以防万一)
  "recognizer/patterns/reverse_lookup": "^z[a-z]*?$"
  punctuator:
    half_shape:  # 调整单双引号的输出格式
      "'": { pair: ["「", "」"] }
      "\"": { pair: ["『", "』"] }
      ",": { commit: "，" }
      ".": { commit: "。" }
      # 顿号 (对应键盘上的 \ 键，即回车键上方)
      "\\": { commit: "、" }
      # 分号
      ";": { commit: "；" }
      # 冒号
      ":": { commit: "：" }
      # 问号
      "?": { commit: "？" }
      # 感叹号
      "!": { commit: "！" }
      # 书名号 (对应 < > 键)
      "<": { commit: "《" }
      ">": { commit: "》" }
      # 中括号 (对应 [ ] 键)
      "[": { commit: "【" }
      "]": { commit: "】" }
      # 大括号 (对应 { } 键)
      "{": { commit: "｛" }
      "}": { commit: "｝" }

      # --- 其他常用中文符号 ---
      # 小括号
      "(": { commit: "（" }
      ")": { commit: "）" }
      # 破折号 (对应 Shift + -)
      "_": { commit: "——" }
      # 省略号 (对应 Shift + 6)
      "^": { commit: "……" }
      # 人民币符号 (对应 Shift + 4)
      "$": { commit: "￥" }
      # 间隔号 (对应 Shift + 2 / @，视习惯而定，这里保留默认 @ 符号，或可改为 commit: "·")
      "~": { commit: "～" } # 波浪号

  # 1. 加载 Emoji 滤镜
  "engine/filters/@before 0": simplifier@emoji_suggestion

  # 2. 定义 Emoji 滤镜的行为
  "emoji_suggestion":
    opencc_config: emoji.json
    option_name: emoji_suggestion
    tips: all

  # 3. (可选) 默认开启 Emoji 开关
  "switches/@next":
    name: emoji_suggestion
    reset: 1
    states: [ "🈚️", "🈶" ]

